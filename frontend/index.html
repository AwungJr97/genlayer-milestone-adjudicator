<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GenLayer Milestone Adjudicator</title>
  <style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px}textarea,input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px}button{cursor:pointer}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px}</style>
</head>
<body>
  <h1>Milestone Adjudicator</h1>
  <p>Submit a milestone and evidence, then let GenLayer consensus adjudicate it.</p>
  <input id="address" placeholder="Deployed contract address (0x...)" />
  <textarea id="requirement" placeholder="Milestone requirement"></textarea>
  <textarea id="evidence" placeholder="Evidence"></textarea>
  <button id="run">Adjudicate with GenLayer</button>
  <pre id="output">Ready.</pre>

  <script type="module">
    import { createClient } from "https://esm.sh/genlayer-js";
    import { studionet } from "https://esm.sh/genlayer-js/chains";
    import { TransactionStatus } from "https://esm.sh/genlayer-js/types";

    const output = document.querySelector('#output');
    const client = createClient({ chain: studionet });

    async function send(functionName, args) {
      const txHash = await client.writeContract({ address: document.querySelector('#address').value.trim(), functionName, args, value: 0n });
      return client.waitForTransactionReceipt({ hash: txHash, status: TransactionStatus.ACCEPTED });
    }

    document.querySelector('#run').onclick = async () => {
      const address = document.querySelector('#address').value.trim();
      const requirement = document.querySelector('#requirement').value.trim();
      const evidence = document.querySelector('#evidence').value.trim();
      if (!address || !requirement || !evidence) return output.textContent = 'Fill all fields first.';
      try {
        output.textContent = 'Saving case on-chain...';
        await send('set_case', [requirement, evidence]);
        output.textContent = 'Case saved. Starting GenLayer adjudication...';
        const receipt = await send('adjudicate', []);
        const decision = await client.readContract({ address, functionName: 'get_decision', args: [] });
        output.textContent = `Consensus status: ${receipt.statusName}\nDecision: ${decision}`;
      } catch (error) {
        output.textContent = `Error: ${error.message || error}`;
      }
    };
  </script>
</body>
</html>
